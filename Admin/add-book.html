<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Book | Admin</title><link rel="stylesheet" href="../CSS/style.css"></head><body><header class="site-header"><a class="brand" href="admin-dashboard.html">LIBRARY<span>.</span> ADMIN</a><nav class="site-nav"><a href="admin-dashboard.html">Dashboard</a><a href="book-management.html">Books</a><a href="members.html">Members</a><a href="reports.html">Reports</a></nav></header><main class="container"><div class="form-card wide"><h2>Add New Book</h2><p class="form-intro">Enter details of the new book.</p><form onsubmit="addBook(event)"><div class="form-group"><label for="bookTitle">Book Title</label><input class="field" id="bookTitle" required></div><div class="form-group"><label for="bookAuthor">Author</label><input class="field" id="bookAuthor" required></div><div class="form-group"><label for="bookCategory">Category</label><select class="field" id="bookCategory" required><option value="">Select category</option><option>Fiction</option><option>Technology</option><option>Business</option><option>Self Help</option></select></div><div class="form-group"><label for="bookISBN">ISBN</label><input class="field" id="bookISBN" required></div><button class="btn" type="submit">Save Book</button></form></div></main><footer class="site-footer">© 2026 Library Management System</footer><script src="../JS/script.js"></script></body></html>
