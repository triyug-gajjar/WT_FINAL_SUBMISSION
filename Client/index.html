<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Library | Login & Registration</title><link rel="stylesheet" href="../CSS/style.css"></head>
<body><header class="site-header"><a class="brand" href="index.html">LIBRARY<span>.</span></a><nav class="site-nav"><a class="active" href="index.html">User Login</a><a href="../Admin/admin-dashboard.html">Admin Login</a></nav></header>
<main class="container"><div class="form-card"><h2>Welcome to the Library</h2><p class="form-intro">Login to your account or create a new membership.</p>
<div class="tabs"><button type="button" id="loginTab" class="active" onclick="showLogin()">Login</button><button type="button" id="registerTab" onclick="showRegister()">Register</button></div>
<form id="loginForm"><div class="form-group"><label for="loginEmail">Email Address</label><input class="field" id="loginEmail" type="text" placeholder="name@example.com"></div><div class="form-group"><label for="loginPassword">Password</label><input class="field" id="loginPassword" type="password" placeholder="Enter password"></div><p id="loginMessage" class="error-message"></p><button class="btn" type="submit">Login to Account</button><p class="form-footer">New member? <a href="#" onclick="showRegister();return false;">Create an account</a></p></form>
<form id="registerForm" class="hidden"><div class="form-group"><label for="registerName">Full Name</label><input class="field" id="registerName" type="text" placeholder="Enter full name"></div><div class="form-group"><label for="registerEmail">Email Address</label><input class="field" id="registerEmail" type="text" placeholder="name@example.com"></div><div class="form-group"><label for="registerPhone">Phone Number</label><input class="field" id="registerPhone" type="text" maxlength="10" placeholder="10-digit mobile number"></div><div class="form-group"><label for="registerPassword">Password</label><input class="field" id="registerPassword" type="password" placeholder="Create a strong password"><small>At least 8 characters with uppercase, lowercase, number and special character.</small></div><div class="form-group"><label for="confirmPassword">Confirm Password</label><input class="field" id="confirmPassword" type="password" placeholder="Re-enter password"></div><p id="registerMessage" class="error-message"></p><button class="btn" type="submit">Create Account</button><p class="form-footer">Already registered? <a href="#" onclick="showLogin();return false;">Login here</a></p></form>
</div></main><footer class="site-footer">© 2026 Library Management System</footer><script src="../JS/script.js"></script><script src="../JS/login-validation.js"></script><script src="../JS/registration-validation.js"></script></body></html>
